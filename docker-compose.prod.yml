# Üretim benzeri yığın: postgres + tek konteynerde API/arayüz.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Geliştirme yığınından (docker-compose.yml) ayrı dosya: orada yalnızca veritabanı
# vardı ve uygulama makinede çalışıyordu. Burada uygulama da konteynerde ve
# postgres dışarıya port açmıyor.
services:
  postgres:
    image: postgres:16-alpine
    container_name: t3-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-t3ekosistem}
      POSTGRES_USER: ${POSTGRES_USER:-t3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    # Port yayımlanmıyor: veritabanına yalnızca uygulama ağı üzerinden erişilir.
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t3} -d ${POSTGRES_DB:-t3ekosistem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: t3-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bağlantı dizesi konteyner ağındaki servis adını kullanıyor.
      T3_ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-t3ekosistem};Username=${POSTGRES_USER:-t3};Password=${POSTGRES_PASSWORD}"
      T3_Jwt__Secret: ${T3_JWT_SECRET:?T3_JWT_SECRET gerekli}

      # Şemayı uygulamanın kendisi kurar: "tek komutla kalkan yığın" hedefi bunu
      # gerektiriyor (bkz. Program.cs, Database:MigrateOnStartup).
      T3_Database__MigrateOnStartup: "true"

      # Tohum verisi üretimde çalışmaz; değer yine de açıkça yazılıyor ki
      # yapılandırmayı okuyan kişi kararı görsün.
      T3_Seed__Enabled: "false"

      # TLS: sunucu t3girisimportali.com üzerinde HTTPS ile hizmet veriyor,
      # bu yüzden varsayılan artık açık. Ters vekil kurulumuna dönülürse bu
      # değeri bilinçli olarak "false" yapıp vekilde TLS sonlandırın — sessiz
      # bir "TLS yok" durumu istemiyoruz (bkz. G-03, Guvenlik_Denetimi raporu).
      T3_Hosting__RequireHttps: ${REQUIRE_HTTPS:-true}
      # Vekilin/ağ geçidinin IP'si zorunlu: yanlış ya da eksikse denetim izine
      # ve hız sınırına gerçek istemci yerine tek bir adres yazılır (herkes
      # aynı kovaya düşer). Konteyner içinden `docker network inspect
      # <ağ_adı> | grep Gateway` ile bulunur — bkz. .env.prod.example.
      T3_Hosting__TrustedProxies__0: ${TRUSTED_PROXY_IP:?TRUSTED_PROXY_IP gerekli — docker network inspect ile bulun}

      # Şifre sıfırlama bağlantısı bu adresten kurulur — istekteki Host
      # başlığından değil.
      T3_Email__AppBaseUrl: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL gerekli}
      T3_Email__From: ${MAIL_FROM:-no-reply@t3ekosistem.test}
      T3_Email__ReplyTo: ${MAIL_REPLY_TO:-}

      # SMTP bilgileri eksikse gönderici ThrowingEmailSender'a düşer (açık hata),
      # tam ise gerçek gönderime geçilir — karar ortamda değil bu dört değerde.
      T3_Email__Smtp__Host: ${SMTP_HOST:-}
      T3_Email__Smtp__Port: ${SMTP_PORT:-587}
      T3_Email__Smtp__User: ${SMTP_USER:-}
      T3_Email__Smtp__Password: ${SMTP_PASSWORD:-}

      # Arayüz aynı kökten geldiği için CORS'a gerek yok; liste bilinçli boş.
      T3_Cors__Origins__0: ${PUBLIC_BASE_URL}

      T3_Ai__ApiKey: ${T3_AI_API_KEY:-}
    ports:
      # Yalnızca loopback'e bağlanıyor: dışarıya açılan yüz TLS sonlandıran
      # vekil olmalı.
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - api-storage:/app/storage
    # Bu satır olmadan `docker logs` sınırsız büyür — konsol sink'i (Faz A)
    # burada koşuyor ve dosya sink'i zaten storage/logs altında kendi
    # döndürme/saklama sınırına sahip (bkz. appsettings.json, 14 gün).
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  postgres-prod-data:
  api-storage:
