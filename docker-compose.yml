services:
  postgres:
    image: postgres:16-alpine
    container_name: t3-postgres
    restart: unless-stopped
    cap_drop: [ALL]
    mem_limit: 1g
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-t3ekosistem}
      POSTGRES_USER: ${POSTGRES_USER:-t3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
    ports:
      # Yalnızca loopback: bu makinenin dışından erişilemez (bkz. G-17,
      # Guvenlik_Denetimi_ve_Iyilestirme_Plani.md). Uygulama zaten aynı
      # makinede çalışıyor; dışarıdan erişim gerekmiyor.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-t3} -d ${POSTGRES_DB:-t3ekosistem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    # "latest" sabitlendi: sürüm sessizce değişip aynı ortamı iki kez
    # kuramamak riskini taşırdı. Periyodik olarak elle yükseltilmeli.
    image: dpage/pgadmin4:8.14
    container_name: t3-pgadmin
    restart: unless-stopped
    profiles: ["tools"]
    cap_drop: [ALL]
    mem_limit: 512m
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@t3.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD gerekli — bkz. .env.example}
      # Giriş ekranı artık açık: bu port yalnızca loopback'e bağlı olsa da
      # (aşağıda) kimlik doğrulaması olmayan bir DB yöneticisinin varsayılan
      # davranış olması yanlış yönde bir varsayılandı (bkz. G-17).
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Log sorgulama katmanı — bkz. docs/Loglama_Plani.md. Uygulamanın
  # çalışması için gerekli değil (Serilog konsol + dosyaya yine yazar);
  # `pgadmin` gibi opsiyonel bir araç, `--profile observability` ile açılır.
  loki:
    image: grafana/loki:3.4
    container_name: t3-loki
    restart: unless-stopped
    profiles: ["observability"]
    cap_drop: [ALL]
    mem_limit: 512m
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./ops/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"   # yalnızca loopback: log deposu ağa açılmaz

  grafana:
    image: grafana/grafana:11.6.0
    container_name: t3-grafana
    restart: unless-stopped
    profiles: ["observability"]
    cap_drop: [ALL]
    mem_limit: 512m
    depends_on: [loki]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${T3_GRAFANA_PASSWORD:?T3_GRAFANA_PASSWORD gerekli}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/loki.yaml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"   # Grafana'nın varsayılanı 3000, bilinçli farklı dışa port

volumes:
  postgres-data:
  loki-data:
  grafana-data:
